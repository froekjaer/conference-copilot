<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8" />
<title>Conference Co-Pilot</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="top">
  <div class="titel">
    <h1>Conference Co-Pilot</h1>
    <span id="version" class="muted">v–</span>
  </div>
  <span id="statusPille" class="pille pille-off">klar</span>
</header>

<main>
  <section class="kort">
    <h2>1 · Lyd</h2>
    <div class="raekke">
      <label class="felt"><span>Kilde</span>
        <select id="lydKilde" class="vaelger">
          <option value="mikrofon">Mikrofon / lydkort</option>
          <option value="fil">Lydfil</option>
        </select>
      </label>
      <label class="felt bred" id="enhedFelt"><span>Lydindgang</span>
        <select id="enhedVaelger" class="vaelger"></select>
      </label>
      <button id="opdaterEnheder" class="knap sekundaer" title="Opdater enhedsliste">↻</button>
    </div>

    <div class="raekke" id="filFelt">
      <input id="lydFilNavn" class="input" placeholder="Ingen lydfil valgt" readonly />
      <button id="vaelgLydFil" class="knap sekundaer">Vælg fil…</button>
      <button id="rydLydFil" class="knap sekundaer">Ryd</button>
    </div>

    <div class="raekke transport" id="transportFelt">
      <button id="afspil" class="knap">▶ Afspil</button>
      <button id="pause" class="knap sekundaer">⏸ Pause</button>
      <button id="stop" class="knap sekundaer">■ Stop</button>
      <input id="soeg" class="soeg" type="range" min="0" max="1000" value="0" />
      <span id="tidNu" class="muted mono">00:00</span>
      <span class="muted">/</span>
      <span id="tidTotal" class="muted mono">00:00</span>
      <label class="felt lille"><span>Hastighed</span>
        <select id="hastighed" class="vaelger">
          <option value="0.75">0,75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1,25×</option>
        </select>
      </label>
    </div>

    <div class="raekke" id="udgangFelt">
      <label class="felt bred"><span>Lydudgang (afspilning af filen)</span>
        <select id="lydUdgang" class="vaelger"></select>
      </label>
      <label class="felt lille"><span>Lydblok</span>
        <input id="chunkSekunder" class="input" type="number" min="3" max="20" value="6" />
      </label>
    </div>

    <div class="raekke">
      <button id="startKnap" class="knap primaer">▶ Start</button>
      <button id="stopKnap" class="knap" disabled>■ Stop</button>
      <span id="niveauTekst" class="muted">niveau: –</span>
    </div>
    <div id="lydStatus" class="muted"></div>
  </section>

  <section class="kort">
    <h2>2 · API-nøgle og model</h2>
    <div id="noegleStatus" class="muted"></div>
    <div class="raekke">
      <input id="noegleFil" class="input" placeholder="Ingen nøglefil valgt" readonly />
      <button id="vaelgNoegleFil" class="knap sekundaer">Vælg nøglefil…</button>
      <button id="rydNoegleFil" class="knap sekundaer">Ryd</button>
    </div>
    <div class="raekke">
      <input id="noegleInput" type="password" class="input" placeholder="Indsæt API-nøgle (gemmes krypteret med Windows DPAPI)" autocomplete="off" />
      <button id="gemNoegle" class="knap">Gem</button>
      <button id="sletNoegle" class="knap sekundaer">Slet</button>
    </div>

    <div class="raekke">
      <label class="felt"><span>Udbyder</span><select id="provider" class="vaelger"></select></label>
      <label class="felt bred"><span>Base-URL</span><input id="baseUrl" class="input" /></label>
    </div>
    <div class="raekke">
      <label class="felt bred"><span>Transskription</span><select id="sttModel" class="vaelger"></select></label>
      <label class="felt bred"><span>Oversættelse</span><select id="mtModel" class="vaelger"></select></label>
    </div>
    <div class="raekke">
      <label class="felt"><span>Egen model (ID)</span><input id="egenModelId" class="input" placeholder="fx min-model-v1" /></label>
      <label class="felt lille"><span>Anvendes til</span>
        <select id="egenModelAnvendelse" class="vaelger">
          <option value="stt">Transskription</option>
          <option value="mt">Oversættelse</option>
          <option value="begge">Begge</option>
        </select>
      </label>
      <button id="tilfoejModel" class="knap sekundaer">Tilføj model</button>
    </div>
    <div id="modelStatus" class="muted"></div>

    <div class="raekke">
      <label class="afkrydsning"><input id="demoTilstand" type="checkbox" /> Demo-tilstand (ingen API-kald)</label>
      <button id="testForbindelse" class="knap sekundaer">Test forbindelse</button>
      <span id="testStatus" class="muted"></span>
    </div>
  </section>

  <section class="kort">
    <h2>3 · Overlay</h2>
    <div class="raekke">
      <label class="felt"><span>Skærm</span><select id="skaermVaelger" class="vaelger"></select></label>
      <label class="felt"><span>Placering</span>
        <div class="knapgruppe">
          <button class="knap sekundaer" data-preset="øverst">Øverst</button>
          <button class="knap sekundaer" data-preset="midten">Midt</button>
          <button class="knap sekundaer" data-preset="nederst">Nederst</button>
        </div>
      </label>
    </div>
    <div class="raekke">
      <label class="felt"><span>Bredde <b id="breddeVaerdi">90</b> %</span>
        <input id="bredde" type="range" min="20" max="100" value="90" />
      </label>
      <label class="felt"><span>Højde <b id="hoejdeVaerdi">22</b> %</span>
        <input id="hoejde" type="range" min="6" max="60" value="22" />
      </label>
    </div>
    <div class="raekke">
      <label class="afkrydsning"><input id="redigeringstilstand" type="checkbox" /> Flyt overlayet (træk i vinduet)</label>
      <button id="visOverlay" class="knap sekundaer">Vis overlay</button>
      <button id="skjulOverlay" class="knap sekundaer">Skjul</button>
      <button id="proevTekst" class="knap sekundaer">Send prøvetekst</button>
    </div>
    <div class="muted">I redigeringstilstand kan du trække overlayet med musen; slå den fra igen for at klikke igennem til PowerPoint.</div>
  </section>

  <section class="kort">
    <h2>4 · Udseende</h2>
    <div class="raekke">
      <label class="felt"><span>Skrifttype</span>
        <select id="skriftFamilie" class="vaelger">
          <option>Segoe UI</option><option>Arial</option><option>Calibri</option>
          <option>Verdana</option><option>Tahoma</option><option>Georgia</option><option>Times New Roman</option>
        </select>
      </label>
      <label class="felt"><span>Tekststørrelse <b id="fontVaerdi">34</b> px</span>
        <input id="fontStoerrelse" type="range" min="12" max="96" value="34" />
      </label>
      <label class="felt lille"><span>Justering</span>
        <select id="justering" class="vaelger">
          <option value="left">Venstre</option><option value="center">Centreret</option><option value="right">Højre</option>
        </select>
      </label>
    </div>
    <div class="raekke">
      <label class="felt lille"><span>Tekstfarve</span><input id="tekstFarve" type="color" value="#ffffff" class="farvet" /></label>
      <label class="felt lille"><span>Konturfarve</span><input id="konturFarve" type="color" value="#000000" class="farvet" /></label>
      <label class="felt"><span>Kontur <b id="konturVaerdi">2</b> px</span>
        <input id="konturPx" type="range" min="0" max="8" value="2" />
      </label>
      <label class="afkrydsning"><input id="skygge" type="checkbox" /> Skygge i stedet for kontur</label>
    </div>
    <div class="raekke">
      <label class="felt lille"><span>Baggrund</span><input id="baggrundFarve" type="color" value="#000000" class="farvet" /></label>
      <label class="felt"><span>Gennemsigtighed <b id="alphaVaerdi">55</b> %</span>
        <input id="baggrundAlpha" type="range" min="0" max="100" value="55" />
      </label>
      <label class="felt lille"><span>Maks. linjer</span>
        <input id="maxLinjer" class="input" type="number" min="1" max="6" value="3" />
      </label>
      <label class="afkrydsning"><input id="visKilde" type="checkbox" checked /> Vis originalsprog ovenover</label>
    </div>
  </section>

  <section class="kort">
    <h2>5 · Transskription</h2>
    <div class="toertekst">
      <div class="kolonne"><div class="etikette">Original</div><div id="kildeTekst" class="tekstboks"></div></div>
      <div class="kolonne"><div class="etikette">Over­sættelse</div><div id="oversatTekst" class="tekstboks"></div></div>
    </div>
    <div class="raekke">
      <span id="blokTal" class="muted">0 blokke</span>
      <span id="ordTal" class="muted">0 ord</span>
      <button id="aabnMappe" class="knap sekundaer">Åbn transskriptionsmappe</button>
    </div>
    <pre id="log" class="log"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
