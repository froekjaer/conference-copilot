<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <title>Overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #ramme {
      position: absolute; inset: 8px; border-radius: 14px; padding: 18px 22px;
      background: rgba(10, 12, 18, var(--alpha, .55));
      backdrop-filter: blur(6px);
      display: flex; flex-direction: column; justify-content: center; gap: 8px;
      box-shadow: 0 6px 26px rgba(0,0,0,.35);
    }
    #kilde { color: #c9d6ea; font-size: calc(var(--skrift, 34px) * .62); line-height: 1.25; opacity: .92; }
    #oversat { color: #ffffff; font-size: var(--skrift, 34px); line-height: 1.25; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
    #kilde:empty { display: none; }
  </style>
</head>
<body>
  <div id="ramme">
    <div id="kilde"></div>
    <div id="oversat">Conference Co-Pilot klar</div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
